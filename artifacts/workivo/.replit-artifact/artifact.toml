kind = "web"
previewPath = "/"
title = "Workivo Landing Page"
version = "1.0.0"
id = "artifacts/workivo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25592

[services.development]
run = "pnpm --filter @workspace/workivo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workivo", "run", "build" ]
serve = "static"
publicDir = "artifacts/workivo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25592"
BASE_PATH = "/"
